# ════════════════════════════════════════════════════════════════
#  KoalaGuard — server-authoritative anticheat (Paper 1.21.11)
#
#  There are NO timing/cps/ms/distance thresholds. Every check runs
#  against packet-reconstructed, tick-simulated state and only acts on
#  PERSISTENT divergence (a sustained violation score), never a spike.
#  Defaults are tuned for zero false positives on a laggy network.
# ════════════════════════════════════════════════════════════════

debug: false

messages:
  prefix: "&b[KoalaGuard] "

alerts:
  permission: "koalaguard.alerts"
  console: true

punishments:
  broadcast: false

# ── Anti-false-positive gate ─────────────────────────────────────
# A confirmed violation is still DROPPED while any of these hold. The
# engine additionally has its own rolling-median RTT instability gate.
safety:
  allow-bans: false
  max-ping-ms: 320
  min-tps: 17.5
  flag-cooldown-ms: 600
  teleport-grace-ms: 1500
  velocity-grace-ms: 900
  damage-grace-ms: 600
  join-grace-ms: 3500
  respawn-grace-ms: 2500
  unstable-downgrade: "warn"

# ── Violation level decay (the kept punishment pipeline) ─────────
violation-decay: 1.0
decay-interval: 30
reward-decay: 0.05

discord:
  bot-token: ""
  alert-channel-id: ""

# ════════════════════════════════════════════════════════════════
#  Checks
#  punishment: warn | kick | ban     ban-duration: 7d | 24h | permanent
#  max-violations: confirmed-violation count at which punishment fires
#  Tunables below are envelope/score knobs, NOT raw metric thresholds.
# ════════════════════════════════════════════════════════════════
checks:

  # ── MOVEMENT (server-authoritative physics) ──
  prediction:
    enabled: true
    max-violations: 14
    punishment: kick
    ban-duration: 14d
    horizontal-epsilon: 0.0015
    vertical-epsilon: 0.02
    score-scale: 24.0
    threshold: 8.0
    min-streak: 6
    confirm-cooldown-ticks: 20

  phase:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    score-per-tick: 6.0
    threshold: 14.0
    min-streak: 3

  nofall:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-fall: 3.2
    score: 6.0
    threshold: 12.0
    min-streak: 2

  timer:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    window-ticks: 60
    max-ratio-excess: 0.18
    score-scale: 40.0
    threshold: 10.0
    min-streak: 2

  # ── COMBAT (reconstructed-position raytrace + aim) ──
  reach:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 14d
    max-reach: 3.0
    max-jitter-slack: 0.5
    score-scale: 18.0
    threshold: 9.0
    min-streak: 3

  hitvalidation:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    angle-slack-deg: 9.0
    angle-score-scale: 0.6
    noswing-score: 5.0
    swing-window-ticks: 4
    threshold: 9.0
    min-streak: 4

  rotation:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    combat-window-ticks: 50
    samples: 40
    min-samples: 26
    min-active: 16
    min-entropy: 1.35
    entropy-scale: 18.0
    min-gcd: 0.30
    gcd-score: 5.0
    snap-mean: 12.0
    max-pitch-sd: 0.06
    snaplock-score: 5.0
    threshold: 16.0
    min-streak: 5

  velocity:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-knockback: 0.10
    window-ticks: 6
    min-fraction: 0.33
    score-scale: 22.0
    threshold: 9.0
    min-streak: 3

  # ── INVENTORY (interaction-chain state machines) ──
  inventorychain:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    score: 4.0
    threshold: 12.0
    min-streak: 4

  autototem:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    score: 6.0
    threshold: 8.0
    min-streak: 2
