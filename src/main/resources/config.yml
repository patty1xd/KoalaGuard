# ════════════════════════════════════════════════════════════════
#  KoalaGuard — server-authoritative anticheat (Paper 1.21.11)
#
#  There are NO timing/cps/ms/distance thresholds. Every check runs
#  against packet-reconstructed, tick-simulated state and only acts on
#  PERSISTENT divergence (a sustained violation score), never a spike.
#  Defaults are tuned for zero false positives on a laggy network.
# ════════════════════════════════════════════════════════════════

debug: false

messages:
  prefix: "&b[KoalaGuard] "

alerts:
  permission: "koalaguard.alerts"
  console: true

punishments:
  broadcast: false

# ── Enforcement (the active response, not just alerts) ───────────
# Movement cheats are rubber-banded by the setback system. Combat
# cheats are silently neutralised: after a CONFIRMED, persistent
# reach/hit violation the player's attack packets are dropped for
# <combat-cancel-ms>, so their hits stop registering (no damage, no
# knockback dealt) with no message. Only fires post-confirmation, so
# a single suspicious hit never cancels a legit fight.
enforcement:
  cancel-combat: true
  combat-cancel-ms: 1500

# ── Anti-false-positive gate ─────────────────────────────────────
# A confirmed violation is still DROPPED while any of these hold. The
# engine additionally has its own rolling-median RTT instability gate.
safety:
  allow-bans: false
  max-ping-ms: 320
  min-tps: 17.5
  flag-cooldown-ms: 600
  teleport-grace-ms: 1500
  velocity-grace-ms: 900
  damage-grace-ms: 600
  join-grace-ms: 3500
  respawn-grace-ms: 2500
  unstable-downgrade: "warn"

# ── Violation level decay (the kept punishment pipeline) ─────────
violation-decay: 1.0
decay-interval: 30
reward-decay: 0.05

discord:
  bot-token: ""
  alert-channel-id: ""

# ════════════════════════════════════════════════════════════════
#  Checks
#  punishment: warn | kick | ban     ban-duration: 7d | 24h | permanent
#  max-violations: confirmed-violation count at which punishment fires
#  Tunables below are envelope/score knobs, NOT raw metric thresholds.
# ════════════════════════════════════════════════════════════════
checks:

  # ── MOVEMENT (server-authoritative physics) ──
  prediction:
    enabled: true
    max-violations: 14
    punishment: kick
    ban-duration: 14d
    horizontal-epsilon: 0.0015
    vertical-epsilon: 0.02
    score-scale: 24.0
    threshold: 8.0
    min-streak: 6
    confirm-cooldown-ticks: 20

  phase:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    score-per-tick: 6.0
    threshold: 14.0
    min-streak: 3

  nofall:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-fall: 3.2
    score: 6.0
    threshold: 12.0
    min-streak: 2

  timer:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    window-ticks: 60
    max-ratio-excess: 0.18
    score-scale: 40.0
    threshold: 10.0
    min-streak: 2

  # ── COMBAT (reconstructed-position raytrace + aim) ──
  reach:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 14d
    max-reach: 3.0
    max-jitter-slack: 0.5
    score-scale: 18.0
    threshold: 9.0
    min-streak: 3

  hitvalidation:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    angle-slack-deg: 9.0
    angle-score-scale: 0.6
    noswing-score: 5.0
    swing-window-ticks: 4
    threshold: 9.0
    min-streak: 4

  # Only fires on physically impossible aim (out-of-range pitch, or aim
  # quantised to a fixed step over a large sample). Normal PvP cannot trip
  # it — anti-aim is handled by hitvalidation (hit must hit the hitbox).
  rotation:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    threshold: 14.0
    min-streak: 6
    invalid-pitch-score: 8.0
    combat-window-ticks: 60
    samples: 60
    min-active: 45
    min-gcd: 0.5
    quantise-epsilon: 0.012
    min-quantised-fraction: 0.97
    quantise-score: 6.0

  velocity:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-knockback: 0.10
    window-ticks: 6
    min-fraction: 0.33
    score-scale: 22.0
    threshold: 9.0
    min-streak: 3

  # ── INVENTORY (interaction-chain state machines) ──
  inventorychain:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    score: 4.0
    threshold: 12.0
    min-streak: 4

  # Meteor packet fingerprint + TotemGuard behavioural stats. The pop is
  # driven by EntityResurrectEvent and a sequence counter, so it works while
  # the player stands perfectly still; intervals use the confirmed-transaction
  # clock (~1 tick = 50 ms), never wall-clock ms / ping subtraction.
  autototem:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    threshold: 9.0
    min-streak: 2
    brand-score: 12.0          # S4 client brand advertises autototem
    meteor-score: 9.0          # S0 slot-45/window-0 click while attacking
    cluster-score: 8.0         # S0b >=2 inventory clicks in one tick
    cluster-window-ns: 60000000 # 60 ms = one tick
    badpacket-score: 8.0       # S1 consecutive same-slot held-item packets
    fast-ticks: 4              # S3 re-equip this fast = inhuman reaction
    fast-score: 3.0
    min-samples: 5             # S2 cycles before consistency is judged
    sample-cap: 40
    max-sd-ticks: 1.2          # S2 std-dev below this = machine-uniform
    max-mean-ticks: 12.0       # S2 and the mean must also be low
    consistency-score: 9.0
