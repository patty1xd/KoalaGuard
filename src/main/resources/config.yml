messages:
  prefix: "§c[KoalaGuard] §b"

alerts:
  permission: "koalaguard.alerts"
  console: true

punishments:
  # If true, broadcasts punishments to everyone (noisy + leaks info)
  broadcast: false
  # If broadcast=false, who can still see punish messages (when enabled)
  broadcast-permission: "koalaguard.alerts"

# KoalaGuard Configuration
violation-decay: 1
decay-interval: 60

# punishment options: kick | ban | warn
# ban-duration only used when punishment: ban

checks:
  # MOVEMENT
  speed:
    enabled: true
    max-violations: 15
    punishment: kick
    ban-duration: 7d
  fly:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
