# ════════════════════════════════════════════════════════════════
#  KoalaGuard — server-authoritative anticheat (Paper 1.21.11)
#
#  There are NO timing/cps/ms/distance thresholds. Every check runs
#  against packet-reconstructed, tick-simulated state and only acts on
#  PERSISTENT divergence (a sustained violation score), never a spike.
#  Defaults are tuned for zero false positives on a laggy network.
# ════════════════════════════════════════════════════════════════

debug: false

messages:
  prefix: "&b[KoalaGuard] "

alerts:
  permission: "koalaguard.alerts"
  console: true

punishments:
  broadcast: false

# ── Enforcement (the active response, not just alerts) ───────────
# Movement cheats are rubber-banded by the setback system. Combat
# cheats are silently neutralised: after a CONFIRMED, persistent
# reach/hit violation the player's attack packets are dropped for
# <combat-cancel-ms>, so their hits stop registering (no damage, no
# knockback dealt) with no message. Only fires post-confirmation, so
# a single suspicious hit never cancels a legit fight.
enforcement:
  cancel-combat: true
  combat-cancel-ms: 1500

# ── Anti-false-positive gate ─────────────────────────────────────
# A confirmed violation is still DROPPED while any of these hold. The
# engine additionally has its own rolling-median RTT instability gate.
safety:
  allow-bans: false
  max-ping-ms: 320
  min-tps: 17.5
  flag-cooldown-ms: 600
  teleport-grace-ms: 1500
  velocity-grace-ms: 900
  damage-grace-ms: 600
  join-grace-ms: 3500
  respawn-grace-ms: 2500
  unstable-downgrade: "warn"

# ── Violation level decay (the kept punishment pipeline) ─────────
violation-decay: 1.0
decay-interval: 30
reward-decay: 0.05

discord:
  bot-token: ""
  alert-channel-id: ""

# ════════════════════════════════════════════════════════════════
#  Checks
#  punishment: warn | kick | ban     ban-duration: 7d | 24h | permanent
#  max-violations: confirmed-violation count at which punishment fires
#  Tunables below are envelope/score knobs, NOT raw metric thresholds.
# ════════════════════════════════════════════════════════════════
checks:

  # ── MOVEMENT (server-authoritative physics) ──
  prediction:
    enabled: true
    max-violations: 14
    punishment: kick
    ban-duration: 14d
    horizontal-epsilon: 0.0015
    vertical-epsilon: 0.02
    score-scale: 24.0
    threshold: 8.0
    min-streak: 6
    confirm-cooldown-ticks: 20

  phase:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    score-per-tick: 6.0
    threshold: 14.0
    min-streak: 3

  nofall:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-fall: 3.2
    score: 6.0
    threshold: 12.0
    min-streak: 2

  timer:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    window-ticks: 60
    max-ratio-excess: 0.18
    score-scale: 40.0
    threshold: 10.0
    min-streak: 2

  fastclimb:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    max-up: 0.24
    max-down: 0.40
    score-scale: 30.0
    threshold: 8.0
    min-streak: 4

  antivoid:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 14d
    min-air-ticks: 10
    min-fall-dy: -0.15
    score: 5.0
    threshold: 12.0
    min-streak: 6

  airjump:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-jump-impulse: 0.30
    min-air-ticks: 4
    score: 6.0
    threshold: 9.0
    min-streak: 2

  noslow:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    max-web-speed: 0.12
    max-soulsand-speed: 0.16
    score-scale: 50.0
    threshold: 9.0
    min-streak: 4

  # ── COMBAT (reconstructed-position raytrace + aim) ──
  reach:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 14d
    max-reach: 3.0
    max-jitter-slack: 0.5
    score-scale: 18.0
    threshold: 9.0
    min-streak: 3

  hitvalidation:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    angle-slack-deg: 9.0
    angle-score-scale: 0.6
    noswing-score: 5.0
    swing-window-ticks: 4
    threshold: 9.0
    min-streak: 4

  # Only fires on physically impossible aim (out-of-range pitch, or aim
  # quantised to a fixed step over a large sample). Normal PvP cannot trip
  # it — anti-aim is handled by hitvalidation (hit must hit the hitbox).
  rotation:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    threshold: 14.0
    min-streak: 6
    invalid-pitch-score: 8.0
    combat-window-ticks: 60
    samples: 60
    min-active: 45
    min-gcd: 0.5
    quantise-epsilon: 0.012
    min-quantised-fraction: 0.97
    quantise-score: 6.0

  velocity:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-knockback: 0.10
    window-ticks: 6
    min-fraction: 0.33
    score-scale: 22.0
    threshold: 9.0
    min-streak: 3

  # Not a CPS limit — measures inhuman REGULARITY of attack intervals.
  autoclicker:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    sample-cap: 40
    min-samples: 18
    max-mean-ms: 250.0
    max-cv: 0.07
    max-duplicates: 14
    score: 6.0
    threshold: 10.0
    min-streak: 3

  # ── WORLD ──
  nuker:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    window-ns: 70000000
    max-digs-per-tick: 4
    score-scale: 4.0
    threshold: 10.0
    min-streak: 2

  # ── INVENTORY (interaction-chain state machines) ──
  inventorychain:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    score: 4.0
    threshold: 12.0
    min-streak: 4

  # Server-event driven (EntityResurrect + InventoryClick/SwapHand). Works
  # regardless of how the cheat sends packets, while standing still, and under
  # rapid pops. Transaction-tick clock — never wall-clock ms / ping subtraction.
  # A legit totem STACK fires no inventory event → impossible to false-positive.
  autototem:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    threshold: 9.0
    min-streak: 2
    brand-score: 12.0           # S3 brand advertises autototem
    combat-score: 9.0           # S0 re-equip while attacking (GUI impossible)
    fast-ticks: 3               # S1 re-equip within N transaction ticks
    fast-score: 4.0
    consistency-score: 9.0      # S2 machine-uniform interval
    min-samples: 5
    sample-cap: 30
    max-sd-ticks: 1.5
    max-mean-ticks: 14.0

  # ── Additional movement checks ──
  clicktp:      { enabled: true, max-violations: 8,  punishment: kick, ban-duration: 30d, max-horizontal: 1.2, max-vertical: 1.5, score: 12.0, threshold: 10.0, min-streak: 1 }
  blink:        { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, max-frames-per-tick: 9, score-scale: 3.0, threshold: 9.0, min-streak: 2 }
  jesus:        { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, max-dy: 0.12, min-speed: 0.08, score: 5.0, threshold: 12.0, min-streak: 6 }
  spider:       { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, min-up: 0.02, min-air-ticks: 4, score: 5.0, threshold: 10.0, min-streak: 5 }
  # Disabled by default — proper elytra detection needs full glide physics.
  elytrafly:    { enabled: false, max-violations: 10, punishment: kick, ban-duration: 14d, min-climb-dy: 0.15, rocket-window-ms: 3000, score: 3.0, threshold: 12.0, min-streak: 25 }

  # ── Additional combat checks ──
  killaura:     { enabled: true, max-violations: 10, punishment: kick, ban-duration: permanent, multi-window-ns: 800000000, max-targets: 3, multi-score: 5.0, sample-cap: 30, min-samples: 12, max-mean-deg: 2.0, max-sd-deg: 1.2, aim-score: 8.0, max-cone-deg: 70.0, cone-score: 7.0, threshold: 10.0, min-streak: 3 }
  crystalaura:  { enabled: true, max-violations: 10, punishment: kick, ban-duration: 30d, max-per-sec: 7, score-scale: 4.0, threshold: 9.0, min-streak: 3 }
  criticals:    { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d, window-ticks: 4, min-hop: 0.018, max-hop: 0.15, score: 4.0, threshold: 10.0, min-streak: 5 }

  # ── Player / World ──
  inventoryaction: { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d, cluster-window-ns: 60000000, attack-window-ns: 250000000, cluster-score: 8.0, combat-score: 8.0, threshold: 10.0, min-streak: 3 }
  offhandcrash: { enabled: true, max-violations: 8,  punishment: kick, ban-duration: 30d, window-ns: 80000000, max-swaps-per-tick: 3, score-scale: 5.0, threshold: 9.0, min-streak: 2 }
  multiplace:   { enabled: true, max-violations: 8,  punishment: kick, ban-duration: 30d, window-ns: 70000000, max-places-per-tick: 3, score-scale: 4.0, threshold: 10.0, min-streak: 2 }
  scaffold:     { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, max-angle: 75.0, max-reach: 6.0, score: 4.0, threshold: 12.0, min-streak: 4 }
