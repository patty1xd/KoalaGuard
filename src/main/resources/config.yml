# ════════════════════════════════════════════════════════════════
#  KoalaGuard — server-authoritative anticheat (Paper 1.21.11)
#
#  There are NO timing/cps/ms/distance thresholds. Every check runs
#  against packet-reconstructed, tick-simulated state and only acts on
#  PERSISTENT divergence (a sustained violation score), never a spike.
#  Defaults are tuned for zero false positives on a laggy network.
# ════════════════════════════════════════════════════════════════

debug: false

messages:
  prefix: "&b[KoalaGuard] "

alerts:
  permission: "koalaguard.alerts"
  console: true

punishments:
  broadcast: false

# ── Enforcement (the active response, not just alerts) ───────────
# Movement cheats are rubber-banded by the setback system. Combat
# cheats are silently neutralised: after a CONFIRMED, persistent
# reach/hit violation the player's attack packets are dropped for
# <combat-cancel-ms>, so their hits stop registering (no damage, no
# knockback dealt) with no message. Only fires post-confirmation, so
# a single suspicious hit never cancels a legit fight.
enforcement:
  cancel-combat: true
  combat-cancel-ms: 1500
  # After a setback the netty layer drops position-bearing movement packets
  # for this window so cheat packets already queued (blink burst, backstab
  # return, clip rebound) can't immediately undo the rubber-band before
  # Mojang's handler sees them. Rotation packets still pass (no camera lock).
  movement-cancel-ms: 350

# ── Anti-false-positive gate ─────────────────────────────────────
# A confirmed violation is still DROPPED while any of these hold. The
# engine additionally has its own rolling-median RTT instability gate.
safety:
  allow-bans: false
  max-ping-ms: 320
  min-tps: 17.5
  flag-cooldown-ms: 600
  teleport-grace-ms: 1500
  velocity-grace-ms: 900
  damage-grace-ms: 600
  join-grace-ms: 3500
  respawn-grace-ms: 2500
  unstable-downgrade: "warn"

# ── Violation level decay (the kept punishment pipeline) ─────────
violation-decay: 1.0
decay-interval: 30
reward-decay: 0.05

discord:
  bot-token: ""
  alert-channel-id: ""

# ════════════════════════════════════════════════════════════════
#  Checks
#  punishment: warn | kick | ban     ban-duration: 7d | 24h | permanent
#  max-violations: confirmed-violation count at which punishment fires
#  Tunables below are envelope/score knobs, NOT raw metric thresholds.
# ════════════════════════════════════════════════════════════════
checks:

  # ── MOVEMENT (server-authoritative physics) ──
  prediction:
    enabled: true
    max-violations: 14
    punishment: kick
    ban-duration: 14d
    horizontal-epsilon: 0.0015
    vertical-epsilon: 0.02
    score-scale: 24.0
    threshold: 8.0
    min-streak: 6
    confirm-cooldown-ticks: 20
    # Frame-accurate cobweb/powder-snow/etc. exempt + residual-slowdown grace
    # (fixes the FP when knocked into a web mid-fight).
    special-block-grace-ticks: 25

  phase:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    score-per-tick: 6.0
    threshold: 14.0
    min-streak: 3

  nofall:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-fall: 3.2
    score: 6.0
    threshold: 12.0
    min-streak: 2
    # TeleportNoFall variant — after a damaging fall has accumulated, a frame
    # whose dy is strongly POSITIVE (>0.50) is a teleport during the fall
    # (cheat snaps up to reset server fallDistance). Knockback-tick gated so
    # legit knockback-up isn't flagged.
    teleport-up-dy: 0.50
    teleport-score: 8.0
    teleport-min-streak: 1

  timer:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    window-ticks: 60
    max-ratio-excess: 0.18
    score-scale: 40.0
    threshold: 10.0
    min-streak: 2
    # CRITICAL: only evaluate the ratio when there are enough MOVEMENT frames
    # in the window. s.tick (movement-tick counter) FREEZES while the player
    # is stationary (rotation-only packets create no PositionFrame), so a
    # ratio-based comparison gives 0 for any standing-still player. The old
    # slow-timer logic falsely flagged this — which is why "Timer alerts for
    # literally anything, even standing still." Slow-timer detection is now
    # entirely off; it can't be done correctly with this metric.
    min-move-frames: 30

  fastclimb:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    max-up: 0.24
    max-down: 0.40
    score-scale: 30.0
    threshold: 8.0
    min-streak: 4

  antivoid:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 14d
    min-air-ticks: 10
    min-fall-dy: -0.15
    score: 5.0
    threshold: 12.0
    min-streak: 6

  airjump:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    # Detection-restored 2026-05-24: streak=1, impulse=0.36, airTicks=4 — but
    # the check now requires N consecutive non-simGround frames before
    # confirming, which rules out the one-tick step-up FP without losing
    # real AirJump detection (which produces sustained mid-air physics).
    min-jump-impulse: 0.36
    min-air-ticks: 4
    score: 12.0
    threshold: 9.0
    min-streak: 1

  noslow:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    max-web-speed: 0.12
    max-soulsand-speed: 0.16
    score-scale: 50.0
    threshold: 9.0
    min-streak: 4
    # Use-item slowdown bypass (sprint while eating / drawing bow / blocking
    # / using spyglass / drinking). Threshold set sprint-magnitude so legit
    # walking-while-eating (~0.04 b/t) never trips; the cheat lets the
    # player keep near-sprint speed (~0.281 b/t) instead.
    # USE-ONSET GRACE: vanilla doesn't immediately clamp velocity when
    # USE_ITEM starts — there's a 1-3 tick window where the player carries
    # over their previous sprint frame. Without this grace, the check
    # false-alerts on every legit eat-while-sprinting onset.
    # Raised from 0.15 (which was BELOW vanilla walk speed ~0.215 and FP'd on
    # every walking-while-eating). 0.24 sits above walk speed and below sprint
    # — only sustained sprint-while-using trips it.
    max-use-speed: 0.24
    use-score-scale: 30.0
    use-min-streak: 6
    use-grace-ms: 350
    # Hard timeout on a use-item session — if `usingItem` stayed latched past
    # this without a RELEASE_USE_ITEM packet (lost-packet / instant-use latch
    # bug), clear the gate so the check stops FP'ing for the rest of the
    # connection.
    use-max-session-ms: 8000

  # ── COMBAT (reconstructed-position raytrace + aim) ──
  # Lag-compensated: takes the SMALLEST eye→hitbox distance over the victim's
  # positions within lag-window-ms (only flags if out of reach for ALL of
  # them) + recon-slack for eye-reconstruction error. This removes the
  # killaura-range false positives.
  reach:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 14d
    max-reach: 3.0
    max-jitter-slack: 0.5
    recon-slack: 0.30
    lag-window-ms: 200
    score-scale: 18.0
    threshold: 9.0
    min-streak: 4

  # Lag-compensated: victim hitbox rewound to the attack instant, so the
  # angular gate is tight (5°) and catches a small hitbox-expander. The wider
  # fallback slack only applies when no rewound box is available.
  # FakeSwing — ≥2 SWING_HAND packets per single attack within the window
  # (vanilla = 1:1). Some cheats add decoy swings to mimic legit combat
  # animation while the actual attack chain is synthetic.
  hitvalidation:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    angle-slack-deg: 5.0
    fallback-extra-slack-deg: 6.0
    angle-score-scale: 0.6
    noswing-score: 5.0
    swing-window-ticks: 4
    # FakeSwing: now needs BOTH absolute excess AND a high swing:attack ratio.
    # Was firing on legit missed-click sequences (3 swings : 1 hit).
    fake-swing-excess: 5
    fake-swing-min-ratio: 4.0
    fakeswing-score: 4.0
    threshold: 9.0
    min-streak: 4

  # Only fires on physically impossible aim (out-of-range pitch, or aim
  # quantised to a fixed step over a large sample). Normal PvP cannot trip
  # it — anti-aim is handled by hitvalidation (hit must hit the hitbox).
  rotation:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    threshold: 14.0
    min-streak: 6
    invalid-pitch-score: 8.0
    combat-window-ticks: 60
    samples: 60
    min-active: 45
    min-gcd: 0.5
    quantise-epsilon: 0.012
    min-quantised-fraction: 0.97
    quantise-score: 6.0
    # Out-of-range yaw — vanilla wraps to (-180, 180]. Anything beyond is
    # unwrapped cheat output that forgot to normalise. Replaces the previous
    # max-yaw-leap-deg detector which was dead code (signedYawDeltas() wrap
    # made the gate impossible to cross).
    max-yaw-deg: 180.0001

  velocity:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    min-knockback: 0.10
    window-ticks: 6
    min-fraction: 0.33
    # Gate the fraction-absorbed rule on a minimum expected horizontal — tiny
    # kb produces noisy fractions that look like absorption but are just
    # measurement floor.
    min-expected-h: 0.22
    # Reversal rule: was 0.18 against / 0.18 expected — counter-sprint W-tap PvP
    # legitimately nets ~0.20 against-kb motion once friction overtakes the
    # impulse. 0.35 keeps the rule for real reversal cheats only.
    max-against: 0.35
    reversal-score: 8.0
    score-scale: 22.0
    threshold: 9.0
    min-streak: 3
    # Reversal variant — the player moves AGAINST the knockback direction.
    # Signed-projection catch (scalar speed would still look healthy).
    max-against: 0.18
    reversal-score: 8.0

  # Not a CPS limit — measures inhuman REGULARITY of attack intervals.
  autoclicker:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    sample-cap: 40
    min-samples: 18
    max-mean-ms: 250.0
    max-cv: 0.07
    max-duplicates: 14
    score: 6.0
    threshold: 10.0
    min-streak: 3
    # High-rate floor — sustained > 14 CPS (mean < 72 ms) over 28+ samples is
    # the bot signature ±jitter-randomized clickers can't hide (no human keeps
    # ≥14 CPS over 30 clicks). Catches butterfly emulation and triggerbot too.
    inhuman-mean-ms: 72.0
    inhuman-min-samples: 28
    # Absolute physical ceiling — mean < 25 ms (~40 CPS) over 12+ samples is
    # anatomically impossible. Pro drag-clickers max ~32 CPS in 1-s bursts;
    # 40+ CPS sustained is packet injection. Smaller sample threshold because
    # no FP risk; flags on a single sustained burst.
    absolute-impossible-ms: 25.0
    absolute-min-samples: 12

  # ── WORLD ──
  # Nuker now counts DISTINCT block coordinates broken (not raw digging
  # packets). Legit Efficiency-V + Haste-II insta-mine sends START+FINISHED
  # per block (2 packets/block) — the old packet-count limit FP'd at 4
  # packets / 2 blocks. With distinct-block counting, max=4 means 4 different
  # blocks broken in one tick — vanilla cannot do that by hand.
  nuker:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 30d
    window-ns: 70000000
    max-digs-per-tick: 4
    score-scale: 4.0
    threshold: 10.0
    min-streak: 2

  # ── INVENTORY (interaction-chain state machines) ──
  inventorychain:
    enabled: true
    max-violations: 12
    punishment: kick
    ban-duration: 7d
    score: 4.0
    threshold: 12.0
    min-streak: 4

  # ══ AutoTotem family — TotemGuard model ═════════════════════════
  # The pop (EntityResurrectEvent) → re-equip cycle is reconstructed
  # PACKET-PRECISELY (netty nanoseconds), NOT from the 50 ms tick or a
  # Bukkit event synthetic packet moves skip. Each TYPE below is a fully
  # INDEPENDENT check (own buffer, own decision) reading that one shared
  # cycle fact. A legit totem STACK sends no inventory packet and the off
  # hand never stops being a totem ⇒ no cycle is ever built ⇒ FP-proof.

  # BadPackets B — client brand advertises autototem (client outs itself).
  badpacketsbrand: { enabled: true, max-violations: 6, punishment: kick, ban-duration: 30d, score: 12.0, threshold: 9.0, min-streak: 1 }
  # BadPackets C — identical slot-click packet resent within a few ms.
  badpacketsdup:   { enabled: true, max-violations: 3, punishment: kick, ban-duration: 30d, score: 4.0, threshold: 6.0, min-streak: 2, max-gap-ms: 5 }
  # Type A — impossibly fast select→offhand / pop→equip.
  # AutoTotemA — burstSize<=1 cycles are now skipped (legit F-swap of a totem
  # main→offhand is one packet ~80ms after a pop, which used to FP).
  autototema:      { enabled: true, max-violations: 8, punishment: kick, ban-duration: 30d, max-ms: 90.0, max-cycle-ms: 110.0, score: 7.0, threshold: 9.0, min-streak: 3 }
  # Type B — unnaturally low std-dev of re-equip timings.
  autototemb:      { enabled: true, max-violations: 8, punishment: kick, ban-duration: 30d, sample-cap: 20, min-samples: 5, max-sd-ms: 30.0, max-mean-ms: 800.0, score: 8.0, threshold: 10.0, min-streak: 2 }
  # Type C — impossibly consistent std-dev across windows.
  autototemc:      { enabled: true, max-violations: 8, punishment: kick, ban-duration: 30d, window: 5, sample-cap: 40, sd-cap: 20, min-windows: 4, max-sd-of-sd: 8.0, max-mean-sd: 60.0, score: 8.0, threshold: 10.0, min-streak: 2 }
  # Type D — replayed identical packet-timing sequence.
  autototemd:      { enabled: true, max-violations: 8, punishment: kick, ban-duration: 30d, sample-cap: 16, min-samples: 4, max-gap-sd-ms: 4.0, score: 9.0, threshold: 9.0, min-streak: 2 }
  # Type E — impossible low timing outlier (faked randomisation).
  autototeme:      { enabled: true, max-violations: 8, punishment: kick, ban-duration: 30d, sample-cap: 30, min-samples: 8, max-low-ms: 70.0, outlier-z: 2.5, score: 7.0, threshold: 9.0, min-streak: 2 }
  # Type F — totem moved while interacting with the world (screen not open).
  autototemf:      { enabled: true, max-violations: 8, punishment: kick, ban-duration: 30d, score: 5.0, threshold: 10.0, min-streak: 3 }

  # ── Additional movement checks ──
  clicktp:      { enabled: true, max-violations: 8,  punishment: kick, ban-duration: 30d, max-horizontal: 1.2, max-vertical: 1.5, score: 12.0, threshold: 10.0, min-streak: 1, big-score: 20.0, big-min-streak: 1 }
  # Clip / phase-teleport — Meteor .vclip/.hclip/.tp & anything moving THROUGH
  # solid with no server teleport. Evaluated before the >8 reset that used to
  # discard it. Conclusive → confirms immediately + rubber-bands.
  # Clip — min-streak raised 1→2 so a single upstream ray-test FP doesn't
  # rubber-band a legit player. Real cheats still fire within ~100ms.
  clip:         { enabled: true, max-violations: 6,  punishment: kick, ban-duration: 30d, min-dist: 1.0, score: 15.0, threshold: 9.0, min-streak: 2 }
  # ClickTp PATH-B (big-score/big-min-streak) handles the >8-block free-air
  # teleport that the engine baseline-reset would otherwise eat — fires on
  # the first stamped clickTpSeq, no streak.
  blink:        { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, max-frames-per-tick: 9, score-scale: 3.0, threshold: 9.0, min-streak: 2 }
  # Jesus + Dolphin/BounceJesus variant (accumulated descent over recent
  # frames stays near zero — vanilla swim continually sinks between strokes,
  # bouncer never goes below the surface).
  jesus:        { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, max-dy: 0.12, min-speed: 0.08, score: 5.0, threshold: 12.0, min-streak: 6, dolphin-scan: 16, dolphin-max-descent: 0.40, dolphin-score: 4.0, dolphin-min-streak: 4 }
  # SpiderCheck — min-up raised 0.02→0.10 and min-air-ticks 4→8 so corner /
  # doorway jumps don't FP on the upward half of a normal sprint-jump.
  spider:       { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, min-up: 0.10, min-air-ticks: 8, score: 5.0, threshold: 10.0, min-streak: 5 }
  # Disabled by default — proper elytra detection needs full glide physics.
  elytrafly:    { enabled: false, max-violations: 10, punishment: kick, ban-duration: 14d, min-climb-dy: 0.15, rocket-window-ms: 3000, score: 3.0, threshold: 12.0, min-streak: 25 }

  # ══ Aim family — KillAura split into independent, FP-tuned checks ═
  # Each is ONE signal in its OWN file/buffer/alert. The old monolithic
  # killaura false-flagged because a moderate aim cone is wrecked by victim-
  # position desync (~15-25°). These either use desync-proof margins (aima),
  # need no victim position (aimd), or are conservative & off by default (aime).
  # aimA — hit far outside field of view (no-rotate / rage / backtrack aura).
  aima:  { enabled: true,  max-violations: 10, punishment: kick, ban-duration: permanent, max-fov-deg: 80.0, score: 6.0, threshold: 8.0, min-streak: 3 }
  # aimB — attack through a solid block.
  aimb:  { enabled: true,  max-violations: 10, punishment: kick, ban-duration: 30d, min-dist: 1.6, score: 5.0, threshold: 9.0, min-streak: 3 }
  # aimC — multi-target kill-aura.
  aimc:  { enabled: true,  max-violations: 10, punishment: kick, ban-duration: 30d, window-ns: 500000000, max-targets: 3, score: 5.0, threshold: 9.0, min-streak: 2 }
  # aimD — snap onto target then snap back (silent / backtrack aura).
  aimd:  { enabled: true,  max-violations: 10, punishment: kick, ban-duration: permanent, return-window-ticks: 4, snap-min-deg: 22.0, lock-cone-deg: 7.0, return-eps-deg: 9.0, score: 7.0, threshold: 9.0, min-streak: 3 }
  # aimE — machine-perfect aim lock, LAG-COMPENSATED (victim rewound to the
  # attack nanosecond). The geometric catch for Meteor silent aim. Enabled now
  # that desync is fixed; a human's natural spread (sd >~ 2-4°) clears it.
  aime:  { enabled: true,  max-violations: 10, punishment: kick, ban-duration: permanent, sample-cap: 40, min-samples: 20, max-mean-deg: 2.5, max-sd-deg: 1.3, score: 7.0, threshold: 10.0, min-streak: 3 }
  # aimF — sensitivity/GCD quantization collapse. DISABLED BY DEFAULT: series-
  # GCD is genuinely noisy for raw-input / high-DPI players (false-flags them),
  # exactly the caveat in the design notes. Alert-only (never cancels combat).
  # Enable + calibrate min-step-deg from `debug:true` [aimf] logs ONLY after
  # comparing a known-legit player vs the cheat on YOUR server.
  aimf:  { enabled: false, max-violations: 8,  punishment: kick, ban-duration: permanent, combat-window-ns: 1500000000, samples: 200, min-samples: 50, min-active-deg: 0.04, max-active-deg: 30.0, min-turn-sum-deg: 60.0, min-step-deg: 0.05, score: 5.0, pitch-score: 3.0, threshold: 12.0, min-streak: 8 }
  # aimG — unnatural rotation smoothness (no hand tremor). Needs BOTH low
  # jerk-sign-rate AND low entropy, so legit smooth pursuit never confirms.
  aimg:  { enabled: true,  max-violations: 8,  punishment: kick, ban-duration: permanent, combat-window-ns: 1500000000, samples: 200, min-samples: 60, min-active-deg: 0.04, max-active-deg: 30.0, min-turn-sum-deg: 80.0, max-jerk-sign-rate: 0.18, max-entropy-bits: 1.6, score: 5.0, threshold: 12.0, min-streak: 8 }
  # aimH — inhuman target-acquisition reaction (triggerbot / auto-attack on
  # visibility). Lag-comp victim history; only clean acquisitions; flags only
  # when reaction is BOTH too fast AND too consistent over many engagements.
  aimh:  { enabled: true,  max-violations: 8,  punishment: kick, ban-duration: permanent, engage-gap-ns: 1200000000, reach: 3.2, max-plausible-ms: 2000.0, sample-cap: 24, min-samples: 6, max-mean-ms: 90.0, max-sd-ms: 45.0, score: 7.0, threshold: 10.0, min-streak: 3 }

  # SpoofedRotation — catches silent-aim / silent-scaffold / auto-crystal /
  # any cheat that overrides the packet rotation to perfectly track an action
  # target (Meteor / LiquidBounce / Wurst / Sigma). Samples the angular error
  # from packet-stamped rotation to the action's geometric target across
  # attacks AND block-places; flags when BOTH mean AND SD collapse below
  # human anatomical limits over 18+ actions.
  #
  # max-mean-deg/max-sd-deg are the human floor — vanilla aiming has 3-8°
  # SD even on a perfect lock; sub-1° / sub-0.5° over 18 actions is forged.
  # max-sample-deg drops obvious misses (the cheat always lands square so
  # 12°-off samples are not its signature and would only inflate variance).
  spoofedrotation:
    enabled: true
    max-violations: 6
    punishment: kick
    ban-duration: permanent
    sample-cap: 40
    sample-stale-ns: 6000000000
    min-samples: 18
    min-span-ns: 1500000000
    max-sample-deg: 12.0
    max-mean-deg: 1.2
    max-sd-deg: 0.6
    reflag-cooldown-ns: 2000000000
    score: 9.0
    threshold: 9.0
    min-streak: 1
  # Crystal break rate + respawn-anchor cycle rate. Catches classic
  # CrystalAura plus AnchorAura / safe-anchor / Wurst's AnchorAura. The
  # silent-aim part of aura attacks lands on AimA-H independently.
  crystalaura:  { enabled: true, max-violations: 10, punishment: kick, ban-duration: 30d, max-per-sec: 7, max-anchor-per-sec: 5, score-scale: 4.0, anchor-score-scale: 4.0, threshold: 9.0, min-streak: 3 }
  # Uses PRECISE simGround + a real-fall exclusion so legit jump/air crits
  # never flag — only a hop that never leaves the ground and never falls.
  # `cap-*` keys surface the HIGHEST-priority damage-event PREVENTION that
  # strips the crit multiplier when server thinks fallDistance > 0 but the
  # engine's recent simGround frames disagree. Catches ALL LiquidBounce
  # variants (NoGround, Packet [Vanilla/NCP/Falling/Low/Down/Grim/BlocksMC],
  # MiniJump, Blink, Timer) at the damage edge — they all need server to
  # believe in a fall, which the engine's collision-truth contradicts.
  criticals:    { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d, window-ticks: 4, min-hop: 0.018, max-hop: 0.15, max-fall: 0.20, score: 4.0, threshold: 10.0, min-streak: 5, cap-score: 8.0, cap-min-streak: 1, cap-frames: 4 }
  # Mace smash exploit — server-computed smash damage with no genuine fall.
  # `cap-*` keys surface the HIGHEST-priority HARD CAP that REWRITES the
  # damage event to legit-vanilla using the engine's collision-truth real
  # fall (engineRealFall walks frames newest→oldest accumulating -dy until
  # a simGround frame). On flat ground the cap = vanilla base + sharpness
  # margin → cheat literally cannot smash. Legit jump/air smashes pass
  # untouched (real fall is non-zero by collision truth).
  mace:         { enabled: true, max-violations: 10, punishment: kick, ban-duration: 30d, vanilla-max-damage: 25.0, min-fall-blocks: 1.0, window-ticks: 8, min-fall-dy: 0.25, score: 8.0, threshold: 10.0, min-streak: 2, cap-score: 10.0, cap-min-streak: 1 }
  # Shield bypass — two variants, both covered:
  #  • Auto axe-swap (Wurst, LB, Meteor's WeaponSwapOptimizer): swap → hit
  #    → swap-back at machine-consistent cadence (low std-dev).
  #  • Backstab-teleport (Meteor displacement-aura family): position packet
  #    behind victim → attack from behind (bypasses shield front cone) →
  #    teleport back. Caught at HIGHEST damage event: if engine's recent
  #    frames had attacker IN FRONT but server-current is BEHIND, and the
  #    engine-vs-current gap > max-legit-gap (or single step > max-legit-
  #    step), the damage event is CANCELLED (shield holds) + flagged.
  #    Backstab keys below are also read by the HIGHEST handler in
  #    BukkitStateListener.onShieldBackstab.
  shieldbypass:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 30d
    swap-window-ms: 220
    sample-cap: 30
    min-samples: 8
    max-sd-ms: 35.0
    max-mean-ms: 320.0
    score: 7.0
    threshold: 10.0
    min-streak: 3
    # Backstab-teleport prevention
    backstab-scan-frames: 6
    min-front-frames: 3
    max-legit-gap: 2.5
    max-legit-step: 1.0
    backstab-score: 12.0
    backstab-min-streak: 1
  # Honeypot — two invisible trap entities next to a player in a PvP context:
  # an ArmorStand (catches all-entity/mob auras) AND, when fake-player:true, a
  # packet-level GHOST PLAYER sent only to that client (catches players-only
  # aura filters). Neither is renderable/raytraceable by a human, so ANY
  # interact packet on either id is a kill-aura, ~0 FP by construction.
  # max-aim-deg: an invisible entity still has a client hitbox, so a legit
  # player looking toward it (building/mining/fighting) can raytrace it. Only
  # flag when the reconstructed look was MORE than this many degrees off the
  # honeypot — a real crosshair could not have produced that interact.
  # Honeypot — armCombatCancel now only fires AFTER diverge() actually
  # confirmed (was unconditional → silent combat cancel without a fresh
  # confirmation).
  honeypot:     { enabled: true, max-violations: 4, punishment: kick, ban-duration: permanent, fake-player: true, combat-radius: 7.0, spawn-distance: 1.6, lifetime-ms: 2500, cooldown-ms: 12000, max-aim-deg: 50.0, score: 20.0, threshold: 9.0, min-streak: 1 }

  # ── Player / World ──
  # Layer 1 — known cheat-client plugin channel / brand fingerprint. The
  # client outs itself (meteor-client, wurst, liquidbounce, …); vanilla and
  # legit mods never use these. Immediate, ~0 FP.
  cheatclient:  { enabled: true, max-violations: 1, punishment: kick, ban-duration: permanent, score: 20.0, threshold: 9.0, min-streak: 1 }
  # MultiTask — >=2 actions inside one uninterrupted item-use (eat/block/bow
  # + attack OR + block-place OR + drop). Vanilla cancels use the moment any
  # of these happen, so the use-flag staying open IS the contradiction.
  # MultiTask — added use-fresh-ms: the latched netty `usingItem` flag is no
  # longer trusted by itself. We require an actual USE_ITEM packet to have
  # arrived in the last use-fresh-ms window before evaluating. Kills the FP
  # where a lost RELEASE_USE_ITEM left the flag stuck and the player got
  # flagged on any later attack with a continuous-use item still in hand.
  multitask:    { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, max-actions-in-use: 2, use-stale-ms: 30000, use-fresh-ms: 4000, score: 6.0, threshold: 9.0, min-streak: 2 }
  # Inventory automation: AutoArmor / AutoTool / AutoMend (window-0 cluster
  # OR inv-click coincident with attack) AND ChestStealer / FastStealer /
  # AutoSteal (non-zero window-id burst — vanilla shift-click cap is 1/tick,
  # a stealer fires 10+ in 100ms).
  inventoryaction: { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d, cluster-window-ns: 60000000, attack-window-ns: 250000000, chest-burst-window-ns: 250000000, chest-burst-threshold: 6, chest-score-scale: 2.0, cluster-score: 8.0, combat-score: 8.0, threshold: 10.0, min-streak: 3 }
  # Counts swaps bound to the SAME reconstructed tick (vanilla sends <=1/tick,
  # so mashing F can never trip it — only an injected flood can).
  offhandcrash: { enabled: true, max-violations: 8,  punishment: kick, ban-duration: 30d, max-swaps-per-tick: 3, score-scale: 5.0, threshold: 9.0, min-streak: 2 }
  # MultiPlace — limit raised 3→5 since vanilla 1.9+ allows simultaneous
  # mainhand+offhand placement, and the check now counts DISTINCT block
  # coordinates (not raw packets).
  multiplace:   { enabled: true, max-violations: 8,  punishment: kick, ban-duration: 30d, window-ns: 70000000, max-places-per-tick: 5, score-scale: 4.0, threshold: 10.0, min-streak: 2 }
  # Time-aligned to the EXACT place tick + real clicked FACE (not the loose
  # live-eye/block-centre the old version used).
  # Look now comes from the netty-accurate rotation stamped on the place
  # packet (no longer a lagged frame), so a tight max-angle is safe again;
  # cadence only CORROBORATES an aim-off/backward place (rhythmic = human).
  # Scaffold — Bridge (S0 aim-off + S1 backward-walk + S2 cadence) PLUS the
  # Tower variant (vertical-only movement + place below feet + recent jump
  # impulse) PLUS the Grim lastRot bypass (rotation bit-exact identical
  # across 3+ consecutive places — vanilla micro-jitter always perturbs the
  # rotation between actions, so literal float-equality is the fingerprint).
  # ScaffoldCheck — lastrot-streak fixed off-by-one (3 = 3 consecutive
  # identical-rotation places, was effectively requiring 4). Also gates on
  # camera-moved so a stationary player (controller user / AFK tower) sending
  # bit-identical floats doesn't FP.
  scaffold:     { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, max-angle: 65.0, max-reach: 5.5, aim-score: 5.0, min-move: 0.12, back-dot: -0.30, back-score: 5.0, tower-max-horizontal: 0.10, tower-jump-scan: 8, tower-min-jump: 0.30, tower-score: 4.0, lastrot-streak: 3, lastrot-score: 6.0, sample-cap: 24, min-samples: 10, max-sd-interval: 0.6, max-sd-pitch: 0.8, cadence-score: 4.0, threshold: 11.0, min-streak: 4 }
  # AutoWeb — automatic cobweb placement in combat. Data source is the
  # SERVER-AUTHORITATIVE block-place ring (BlockPlaceEvent at MONITOR), NOT
  # the per-tick inventory mirror — a swap-in / place / swap-back cheat
  # clears the mirror before our check runs, which was why the user reported
  # "enemy using autoweb on me and no alerts". The event always fires for
  # the actual placed material, regardless of the cheat's hand-swap timing.
  #
  # Signatures:
  #   S0 self-web without looking down — cobweb placed at attacker's own
  #      position while pitch < self-min-look-down-pitch (legit self-web
  #      requires looking down at feet; the cheat keeps the camera level
  #      to keep fighting).
  #   S1 opponent-web — cobweb placed AT (or right against) an enemy's
  #      rewound hitbox.
  # post-attack and machine-cadence only CORROBORATE — never standalone.
  autoweb:      { enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d, combat-radius: 5.0, self-radius: 1.6, enemy-radius: 1.6, self-min-look-down-pitch: 55.0, self-web-score: 7.0, opponent-web-score: 7.0, combat-score: 5.0, post-attack-window-ns: 400000000, sample-cap: 20, min-samples: 6, max-sd-interval-ms: 35.0, cadence-score: 6.0, threshold: 10.0, min-streak: 2 }

  # ── NEW (2026-05-22) ──
  # VehicleFly / BoatFly — every other movement check exempts `exVehicle`, so
  # this independent check inspects the vehicle entity's vertical motion
  # directly. Boats are the canonical target; flip any-vehicle:true for
  # paranoid mode on pigs/horses (noisier; staircase climbing legit).
  vehiclefly:
    enabled: true
    max-violations: 8
    punishment: kick
    ban-duration: 14d
    any-vehicle: false
    min-up: 0.08
    min-up-ticks: 4
    min-climb: 0.6
    score: 6.0
    threshold: 9.0
    min-streak: 2

  # FastBreak / InstaBreak — tool/enchant/effect-aware vanilla break-time vs
  # measured START_DIGGING→FINISHED_DIGGING latency. ×0.4 tolerance so legit
  # haste-tier transitions or transient lag spikes never trip. Creative is
  # exempt; insta-mine combinations resolve to ~50ms expected and pass.
  fastbreak:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 14d
    min-hardness: 0.4
    tolerance-fraction: 0.40
    score-scale: 8.0
    threshold: 9.0
    min-streak: 3

  # AirPlace — block placed against an air "clicked face" (forged BLOCK_PLACE
  # packet). Only flags when the clicked block is ACTUAL air; cobweb / water
  # / lava / grass / snow / lily / replaceables are valid clicked faces in
  # vanilla (placing water on cobweb is legit — was a false positive). 250ms
  # grace covers the MC-279849 same-tick break-then-replace race.
  airplace:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 14d
    break-grace-ns: 250000000
    score: 5.0
    threshold: 9.0
    min-streak: 2

  # AntiKnockback-Sprint — vanilla cancels sprint on damage (auto-sends
  # STOP_SPRINTING). Cheats suppress that packet to keep the ~30% movement
  # advantage. After damage, if the player is still sprinting AND moving at
  # sprint speed past the window with no STOP_SPRINTING in the log → flag.
  antikbsprint:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 14d
    post-damage-window-ticks: 3
    min-sprint-speed: 0.20
    score: 6.0
    threshold: 9.0
    min-streak: 2

  # BowAimbot / TridentAimbot — projectile aurabot. Requires BOTH a snap-on-
  # release rotation jump (last-tick yaw delta ≫ draw-time mean) AND an
  # inhuman release-angle consistency to nearest enemy across many shots.
  # Human bow flicks have drift around release; bots snap then immediately
  # release.
  bowaimbot:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: permanent
    min-draw-ms: 80
    max-draw-ms: 10000
    snap-min-deg: 18.0
    snap-vs-mean-ratio: 4.0
    sample-cap: 12
    min-samples: 5
    max-mean-deg: 4.0
    max-sd-deg: 2.5
    min-snap-hits: 3
    score: 7.0
    threshold: 9.0
    min-streak: 2

  # SprintHunger — vanilla rule: cannot start sprinting when food < 6.
  # Server-authoritative food level; cheat cannot spoof. Requires both
  # sprinting state AND actual sprint-magnitude movement so a momentum
  # carry-over doesn't FP.
  sprinthunger:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 14d
    # Only flags the EDGE: a not-sprinting → sprinting transition while food
    # < 6. Vanilla forbids STARTING sprint at food<6; CONTINUING sprint (food
    # drops past 6 mid-bridge-run) is allowed and was the FP source.
    min-food-to-sprint: 6
    min-sprint-speed: 0.20
    score: 6.0
    threshold: 9.0
    min-streak: 2

  # MacroCheck — tick-locked input macros (W-tap sprint-toggle / jump-reset).
  # Tracks the gap between consecutive START_SPRINTING ENTITY_ACTIONs and
  # between consecutive jump impulses. A human's gap has 8-15 ms intrinsic
  # jitter every attempt; a macro snaps to the server tick with ±0-1 ms
  # variance over 14+ attempts. Combat-gated so non-combat sprint+jump
  # navigation isn't evaluated.
  macro:
    enabled: true
    max-violations: 10
    punishment: kick
    ban-duration: 14d
    combat-window-ns: 1500000000
    sample-cap: 24
    # Raised from 14 → 24 samples and tightened sd from 4.0 → 1.5 ms — skilled
    # W-tappers locked to click cadence produce sd~2-3 ms over short windows
    # which FP'd the macro detector. Real macros sit at <1 ms over many samples.
    min-samples: 24
    max-sd-ms: 1.5
    max-sprint-mean-ms: 250.0
    max-jump-mean-ms: 800.0
    min-jump-impulse: 0.30
    sprint-score: 7.0
    jump-score: 7.0
    threshold: 9.0
    min-streak: 3
