# ════════════════════════════════════════════════════════════════
#  KoalaGuard — Paper 1.21.11 anticheat
#  Alerts are rich (hover + colour in-game, embeds in Discord).
#  Defaults are tuned for ZERO false positives on a laggy network.
# ════════════════════════════════════════════════════════════════

# Verbose per-flag debug to console.
debug: false

messages:
  prefix: "&b[KoalaGuard] "

alerts:
  # Players with this permission see in-game alerts.
  permission: "koalaguard.alerts"
  console: true

punishments:
  # Broadcast punishments to everyone (false = staff only).
  broadcast: false

# ── Anti-false-positive gate ─────────────────────────────────────
# A flag is DROPPED entirely while any of these are true.
safety:
  # Bans are OFF until you trust your tuning. Ban punishments fall back to kick.
  allow-bans: false
  max-ping-ms: 320
  min-tps: 17.5
  flag-cooldown-ms: 600
  teleport-grace-ms: 1500
  velocity-grace-ms: 900
  damage-grace-ms: 600
  join-grace-ms: 3500
  respawn-grace-ms: 2500
  # When server is unstable, downgrade any punishment to this.
  unstable-downgrade: "warn"

# ── Violation level decay ────────────────────────────────────────
# Every <decay-interval>s each check's VL drops by <violation-decay>.
violation-decay: 1.0
decay-interval: 30
# Per clean action a check bleeds this much VL.
reward-decay: 0.05

# ── Discord (rich embeds) ────────────────────────────────────────
# 1. https://discord.com/developers/applications → New Application → Bot
# 2. Copy the bot TOKEN, invite with "Send Messages" + "Embed Links"
# 3. Enable Developer Mode, right-click your channel → Copy Channel ID
discord:
  bot-token: ""
  alert-channel-id: ""

# ════════════════════════════════════════════════════════════════
#  Checks
#  punishment: warn | kick | ban     ban-duration: 7d | 24h | permanent
#  max-violations: VL at which the punishment fires
# ════════════════════════════════════════════════════════════════
checks:

  # ── MOVEMENT ──
  speed:        { enabled: true, max-violations: 20, punishment: kick, ban-duration: 7d }
  strafe:       { enabled: true, max-violations: 18, punishment: kick, ban-duration: 7d }
  motion:       { enabled: true, max-violations: 15, punishment: kick, ban-duration: 7d }
  fly:          { enabled: true, max-violations: 12, punishment: kick, ban-duration: 14d }
  nofall:       { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d }
  step:         { enabled: true, max-violations: 15, punishment: kick, ban-duration: 7d }
  jesus:        { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d }
  noslow:       { enabled: true, max-violations: 15, punishment: kick, ban-duration: 7d }
  sprint:       { enabled: true, max-violations: 18, punishment: kick, ban-duration: 7d }
  phase:        { enabled: true, max-violations: 10, punishment: kick, ban-duration: 30d }
  timer:        { enabled: true, max-violations: 14, punishment: kick, ban-duration: 7d, balance-ms: 320 }
  fastclimb:    { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d }
  antihunger:   { enabled: true, max-violations: 15, punishment: kick, ban-duration: 7d }
  web:          { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d }
  elytrafly:    { enabled: true, max-violations: 12, punishment: kick, ban-duration: 14d }
  blink:        { enabled: true, max-violations: 10, punishment: kick, ban-duration: 7d }
  scaffold:     { enabled: true, max-violations: 12, punishment: kick, ban-duration: 14d, max-place-rate: 8 }
  burrow:       { enabled: true, max-violations: 8,  punishment: kick, ban-duration: 30d }

  # ── COMBAT ──
  reach:        { enabled: true, max-violations: 12, punishment: kick, ban-duration: 14d, max-reach: 3.0 }
  killaura:     { enabled: true, max-violations: 10, punishment: kick, ban-duration: permanent }
  autoclicker:  { enabled: true, max-violations: 10, punishment: kick, ban-duration: 7d, max-cps: 22 }
  attackspeed:  { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d }
  hitbox:       { enabled: true, max-violations: 10, punishment: kick, ban-duration: 30d }
  aimassist:    { enabled: true, max-violations: 10, punishment: kick, ban-duration: 30d }
  noswing:      { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d }
  invalidattack:{ enabled: true, max-violations: 10, punishment: kick, ban-duration: 14d }
  criticals:    { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d }
  tbot:         { enabled: true, max-violations: 8,  punishment: kick, ban-duration: permanent, min-streak: 6 }
  velocity:     { enabled: true, max-violations: 12, punishment: kick, ban-duration: 7d }
