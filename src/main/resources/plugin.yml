name: KoalaGuard
version: '${project.version}'
main: com.koalaguard.KoalaGuard
api-version: '1.21'
description: High-performance behavioural anticheat for Paper 1.21.11
authors: [ KoalaGuard ]
website: https://github.com/

permissions:
  koalaguard.alerts:
    description: Receive in-game violation alerts
    default: op
  koalaguard.bypass:
    description: Exempt from every check
    default: false
  koalaguard.admin:
    description: Access KoalaGuard admin commands (info, reload, bans, checks)
    default: op
    children:
      koalaguard.admin.info: true
  koalaguard.admin.info:
    description: View a player's violations + ping + brand
    default: false
  koalaguard.admin.unban:
    description: Remove a ban entry by canonical UUID
    default: op
  koalaguard.admin.tp:
    description: Teleport to a player via /kg tp
    default: op
  koalaguard.admin.replay:
    description: List, play and stop saved player-ban replays
    default: op
  koalaguard.admin.*:
    description: All admin sub-permissions (info / unban / tp / replay)
    default: op
    children:
      koalaguard.admin.info: true
      koalaguard.admin.unban: true
      koalaguard.admin.tp: true
      koalaguard.admin.replay: true

commands:
  koalaguard:
    description: KoalaGuard admin command
    aliases: [ kg, koala ]
    permission: koalaguard.admin
    usage: /koalaguard <reload|checks|info|tp|bans|unban|discord|replay>
