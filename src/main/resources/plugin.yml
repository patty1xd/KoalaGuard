name: KoalaGuard
version: '${project.version}'
main: com.koalaguard.KoalaGuard
api-version: '1.21'
description: High-performance behavioural anticheat for Paper 1.21.11
authors: [ KoalaGuard ]
website: https://github.com/

permissions:
  koalaguard.alerts:
    description: Receive in-game violation alerts
    default: op
  koalaguard.bypass:
    description: Exempt from every check
    default: false
  koalaguard.admin:
    description: Access KoalaGuard admin commands
    default: op

commands:
  koalaguard:
    description: KoalaGuard admin command
    aliases: [ kg, koala ]
    permission: koalaguard.admin
    usage: /koalaguard <reload|checks|info|tp|bans|unban|discord>
